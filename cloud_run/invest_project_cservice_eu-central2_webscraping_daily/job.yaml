apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: invest_project_cservice_eu-central2_webscraping_daily.py
  labels:
    cloud.googleapis.com/location: europe-central2
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "1"
    spec:
      containerConcurrency: 1
      timeoutSeconds: 600
      serviceAccountName: sa-cr-cf-invoker@projekt-inwestycyjny.iam.gserviceaccount.com
      containers:
      - image: europe-central2-docker.pkg.dev/projekt-inwestycyjny/cloud-run-source-deploy/invest_project_cservice_eu-central2_webscraping_daily.py:latest
        resources:
          limits:
            cpu: 250m
            memory: 512Mi
        ports:
        - containerPort: 8080